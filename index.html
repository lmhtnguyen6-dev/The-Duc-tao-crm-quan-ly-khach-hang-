/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:11px 18px;display:flex;align-items:center;gap:10px}
.hamb{display:none;background:none;border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:18px;padding:4px 9px;cursor:pointer}
.tb-t{font-family:var(--serif);font-size:17px;color:var(--text);flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--gray);border:1px solid var(--border);border-radius:9999px;padding:6px 13px;width:200px}
.search input{border:none;background:none;font-size:13px;color:var(--text);width:100%;outline:none;font-family:var(--sans)}
.ic-btn{background:var(--gray);color:var(--text2);border:1px solid var(--border);border-radius:9999px;padding:7px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:var(--sans);font-weight:500}
.ic-btn:hover{border-color:#999}
.btn-add{background:var(--navy);color:#fff;border:none;border-radius:9999px;padding:7px 15px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:var(--sans);font-weight:600}
body.dark .btn-add{background:var(--blue);color:#08121f}
.mc{flex:1;overflow-y:auto;padding:18px}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:13px 15px}
.stat-l{font-size:10px;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:4px}
.stat-v{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--text)}
.stat-s{font-size:11px;color:var(--text3);margin-top:3px}

/* CHARTS */
.chgrid{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-bottom:16px}
.chcard{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:14px}
.chcard h4{font-family:var(--serif);font-size:13px;margin-bottom:10px;color:var(--text)}
.chwrap{position:relative;height:200px}

/* CONFIRM */
.cb{background:var(--amber-light);border:1px solid #D4A017;border-radius:var(--rl);padding:13px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.cb.done{background:var(--green-light);border-color:#4CAF50}
.cb-i{flex:1}
.cb-t{font-size:14px;font-weight:600;color:var(--amber)}
.cb-t.done{color:var(--green)}
.cb-s{font-size:12px;color:var(--text2);margin-top:2px}
.btn-cf{background:var(--amber);color:#fff;border:none;border-radius:9999px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}

/* FILTER */
.fr{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.fb{padding:5px 12px;border-radius:9999px;border:1px solid var(--border);background:var(--card);font-size:12px;color:var(--text2);cursor:pointer;font-family:var(--sans);font-weight:500}
.fb.on{background:var(--navy);border-color:var(--navy);color:#fff}
body.dark .fb.on{background:var(--blue);border-color:var(--blue);color:#08121f}
.advbar{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.advbar select{padding:6px 9px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-family:var(--sans);font-size:12px;outline:none}
.advbar label{font-size:11px;color:var(--text3);font-weight:600}

/* TABLE */
.tc{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:9px 12px;text-align:left;font-size:10px;font-weight:600;color:var(--text3);border-bottom:1px solid var(--border);background:var(--th);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
td{padding:9px 12px;border-bottom:1px solid var(--rowline);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--th)}
.st-ok{display:inline-flex;align-items:center;gap:3px;background:var(--green-light);color:var(--green);font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap}
.st-warn{display:inline-flex;align-items:center;gap:3px;background:var(--amber-light);color:var(--amber);font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap;border:1px solid #D4A017}
.st-late{display:inline-flex;align-items:center;gap:3px;background:var(--red-light);color:var(--red);font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;border:1px solid #C62828}
.st-soon{display:inline-flex;align-items:center;gap:3px;background:var(--amber-light);color:var(--amber);font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap}
.st-no{color:var(--text3);font-size:12px;font-style:italic}
.days-pill{font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px}
.t-vip{background:#FFF3E0;color:#BF360C;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid #FF6D00;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.t-dia{background:#F3E5F5;color:#6A1B9A;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid #AB47BC;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.t-gold{background:#FFF8E1;color:#E65100;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid #FFB300;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.t-thu{background:#F0F0EE;color:#777;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;display:inline-flex;align-items:center;gap:3px}
.id-c{background:var(--gray);color:var(--text2);font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--border)}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;background:var(--blue-light);color:var(--blue)}
.av.vav{background:#FFF8E1;color:#E65100}
.nc{display:flex;align-items:center;gap:8px}
.nbold{font-weight:500}
.note-p{font-size:11px;color:var(--text3);font-style:italic;cursor:pointer;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.note-p:hover{color:var(--blue);text-decoration:underline}
.ab{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 6px;font-size:11px;cursor:pointer;color:var(--text2)}
.ab:hover{background:var(--gray)}
.ab.an{background:var(--green-light);border-color:#4CAF50;color:var(--green)}
.ab.nt{border-color:#FFB300;color:#E65100;background:#FFF8E1}
.empty{padding:40px;text-align:center;color:var(--text3);font-size:13px;font-style:italic}

/* VIEW TOGGLE */
.vtg{display:inline-flex;gap:3px;background:var(--gray);border:1px solid var(--border);border-radius:8px;padding:3px}
.vtb{background:none;border:none;border-radius:6px;padding:5px 9px;font-size:13px;color:var(--text3);cursor:pointer;display:flex;align-items:center}
.vtb.on{background:var(--card);color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
body.dark .vtb.on{color:var(--blue)}

/* CUSTOMER CARDS */
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.ccard{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.ccard:hover{border-color:#999}
.cc-top{display:flex;align-items:flex-start;gap:9px}
.cc-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;background:var(--blue-light);color:var(--blue)}
.cc-av.t-v{background:#FFF3E0;color:#BF360C}
.cc-av.t-d{background:#F3E5F5;color:#6A1B9A}
.cc-av.t-g{background:#FFF8E1;color:#E65100}
.cc-nm{font-weight:600;font-size:13.5px;cursor:pointer;line-height:1.3}
.cc-nm:hover{color:var(--blue)}
.cc-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:3px}
.cc-von{font-size:12px;color:var(--text2);font-weight:500}
.cc-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text3)}
.cc-spark{display:flex;align-items:flex-end;gap:2px;height:22px}
.cc-spark b{display:block;width:6px;border-radius:2px 2px 0 0;background:var(--border)}
.cc-spark b.hi{background:var(--blue)}
body.dark .cc-spark b.hi{background:var(--blue)}
.cc-note{font-size:11px;color:var(--text3);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.cc-note:hover{color:var(--blue);text-decoration:underline}
.cc-msg{background:var(--green-light);border:1px solid #4CAF50;color:var(--green);border-radius:7px;padding:6px 0;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-family:var(--sans)}
.cc-msg:hover{filter:brightness(0.96)}
.cc-acts{display:flex;gap:5px;border-top:1px solid var(--rowline);padding-top:8px;margin-top:2px}
.cc-ab{flex:1;background:none;border:1px solid var(--border);border-radius:7px;padding:5px 0;font-size:12px;cursor:pointer;color:var(--text2);text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:3px}
.cc-ab:hover{background:var(--gray)}
.cc-tier-sel{border:1px solid var(--border);border-radius:7px;background:var(--card);color:var(--text2);font-family:var(--sans);font-size:11px;padding:5px 4px;width:100%}

/* KANBAN */
.kan{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kan-col{flex:0 0 236px;background:var(--gray);border:1px solid var(--border);border-radius:var(--rl);display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
.kan-col.drop{outline:2px dashed var(--blue);outline-offset:-3px}
.kan-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 4px;font-weight:600;font-size:13px;border-radius:var(--rl) var(--rl) 0 0;background:var(--card)}
.kan-cnt{background:var(--navy);color:#fff;border-radius:20px;font-size:11px;padding:1px 8px}
body.dark .kan-cnt{background:var(--blue);color:#08121f}
.kan-sub{font-size:11px;color:var(--text3);padding:0 12px 8px;background:var(--card);border-radius:0 0 0 0}
.kan-body{padding:8px;overflow-y:auto;flex:1;min-height:60px}
.kan-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 10px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kan-card:hover{border-color:#999}
.kan-card:active{cursor:grabbing}
.kan-nm{font-weight:600;font-size:13px;margin-bottom:4px}
.kan-meta{display:flex;gap:5px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.kan-von{font-size:12px;color:var(--text2);margin-bottom:7px}
.kan-sel{width:100%;font-size:11px;padding:4px 6px;border:1px solid var(--border);border-radius:6px;background:var(--gray);color:var(--text);font-family:var(--sans);outline:none}
.kan-more{text-align:center;font-size:11px;color:var(--text3);padding:6px;font-style:italic}
.kan-empty{text-align:center;color:var(--text3);font-size:12px;padding:16px}

/* TIER SECTIONS */
.tsec{border-radius:var(--rl);padding:13px 15px;margin-bottom:14px}
.tsec-t{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:7px}

/* ID GRID */
.ig{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.ic{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:13px;cursor:pointer}
.ic:hover{border-color:#999}
.ic-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ic-n{font-family:var(--serif);font-size:15px;font-weight:700}
.ic-s{display:flex;gap:12px}
.ic-ss{font-size:12px;color:var(--text2)}
.ic-ss span{font-weight:600;color:var(--text)}
.pb{height:3px;background:var(--gray);border-radius:2px;margin-top:8px}
.pf{height:100%;border-radius:2px}

/* LOG */
.li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--rowline)}
.ld{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.lt{font-size:12px;color:var(--text2);line-height:1.5;flex:1}
.lti{font-size:11px;color:var(--text3);white-space:nowrap}

/* MODAL */
.mb{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:14px}
.md{background:var(--card);border-radius:var(--rl);padding:20px;width:460px;max-width:100%;max-height:90vh;overflow-y:auto}
.md-t{font-family:var(--serif);font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.mc-x{background:none;border:none;cursor:pointer;font-size:20px;color:var(--text3)}
.fg{margin-bottom:11px}
.fl{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.04em}
.fi{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);color:var(--text);font-family:var(--sans);outline:none}
.fi:focus{border-color:var(--blue)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:4px}
.vo{padding:8px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:12px;text-align:center;font-family:var(--sans);color:var(--text2)}
.vo.sn{background:var(--gray);border-color:#bbb;color:var(--text2)}
.vo.sg{background:#FFF8E1;border-color:#FFB300;color:#E65100;font-weight:500}
.vo.sd{background:#F3E5F5;border-color:#AB47BC;color:#6A1B9A;font-weight:500}
.vo.sv{background:#FFF3E0;border-color:#FF6D00;color:#BF360C;font-weight:500}
.btn-sv{background:var(--navy);color:#fff;border:none;border-radius:9999px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;width:100%;margin-top:6px;font-family:var(--sans)}
body.dark .btn-sv{background:var(--blue);color:#08121f}
.btn-cc{background:none;border:1px solid var(--border);border-radius:9999px;padding:10px;font-size:13px;cursor:pointer;color:var(--text2);width:100%;margin-top:7px;font-family:var(--sans)}
.icg{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.ico{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.ico.sel{border-color:var(--text)!important}

/* SPOTLIGHT */
.sp-ov{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:900;pointer-events:none;transition:background .3s}
.sp-ov.on{background:rgba(0,0,0,.65);pointer-events:all;cursor:pointer}
.sp-box{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:901;background:var(--card);border-radius:14px;padding:22px;width:420px;max-width:92vw;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);display:none;cursor:auto}
.sp-x{position:absolute;top:10px;right:12px;background:none;border:none;cursor:pointer;font-size:22px;color:var(--text3);line-height:1}
.sp-nm{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:10px;color:var(--text)}
.sp-r{display:flex;gap:8px;margin-bottom:7px;font-size:13px}
.sp-lb{color:var(--text3);width:96px;flex-shrink:0;font-size:12px}
.sp-ta{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:13px;font-family:var(--sans);resize:vertical;min-height:64px;outline:none;margin-top:6px;background:var(--card);color:var(--text)}
.sp-ta:focus{border-color:var(--blue)}
.sp-sv{background:var(--navy);color:#fff;border:none;border-radius:9999px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;font-family:var(--sans)}
body.dark .sp-sv{background:var(--blue);color:#08121f}
.nh{margin-top:14px;border-top:1px solid var(--border);padding-top:10px}
.nh-item{background:var(--gray);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12px}
.nh-meta{font-size:10px;color:var(--text3);margin-top:3px}

/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;z-index:9999;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:var(--green)}
.toast.warn{background:var(--amber)}

/* LOGIN */
.ls{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:9999;padding:14px}
.lc{background:#fff;border-radius:16px;padding:32px 36px;width:360px;max-width:100%;text-align:center}
.lt2{font-family:var(--serif);font-size:20px;font-weight:700;color:#181818;margin-bottom:4px}
.ls2{font-size:12px;color:#9A9A9A;margin-bottom:24px;font-style:italic}
.uo{display:flex;align-items:center;gap:10px;padding:10px 13px;border:1.5px solid #E5E5E3;border-radius:9999px;cursor:pointer;margin-bottom:8px;font-size:13px;font-weight:500;background:#fff;font-family:var(--sans);width:100%;text-align:left;color:#1A1A1A}
.uo:hover{border-color:#181818;background:#E3F9EA}
.uav{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.pi{width:100%;padding:9px 11px;border:1.5px solid #E5E5E3;border-radius:9px;font-size:14px;font-family:var(--sans);outline:none;margin-bottom:12px;color:#1A1A1A}
.pi:focus{border-color:#181818}
.lb{width:100%;background:#181818;color:#fff;border:none;border-radius:9999px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans)}
.le{color:#C62828;font-size:13px;margin-top:8px;min-height:18px}
.bb{background:none;border:none;color:#9A9A9A;font-size:12px;cursor:pointer;margin-top:10px;text-decoration:underline}
.sb2{display:flex;align-items:center;gap:10px;background:#E3F9EA;border-radius:10px;padding:10px 13px;margin-bottom:16px;text-align:left}
.warn-cfg{background:#FFF3E0;border:1px solid #FF6D00;color:#BF360C;border-radius:9px;padding:9px 12px;font-size:11.5px;margin-bottom:14px;text-align:left;line-height:1.5}

/* PW CHANGE */
.pw-hint{font-size:11px;margin-top:3px}
.eye-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--text3);background:none;border:none;font-size:16px}
.pi-wrap{position:relative}

@keyframes spin{to{transform:rotate(360deg)}}
.sp{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}

/* RESPONSIVE */
@media(max-width:820px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .chgrid{grid-template-columns:1fr}
  .ig{grid-template-columns:1fr}
  .hamb{display:block}
  .sb{position:fixed;top:0;left:0;bottom:0;z-index:50;transform:translateX(-100%)}
  .sb.open{transform:translateX(0)}
  .scrim.on{display:block}
  .search{width:130px}
  .tb-t{font-size:15px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="LS" class="ls">
  <div class="lc">
    <div class="lt2">CRM — Team Nam VPS</div>
    <div class="ls2">Quản lý khách hàng chứng khoán</div>
    <div id="cfgwarn"></div>
    <div id="step1">
      <p style="font-size:12px;color:#5A5A5A;margin-bottom:12px;font-weight:500">Bạn là ai?</p>
      <div id="ulist"></div>
    </div>
    <div id="step2" style="display:none">
      <div class="sb2">
        <div id="sav" class="uav"></div>
        <div><div style="font-weight:600;font-size:14px;color:#1A1A1A" id="snm"></div><div style="font-size:11px;color:#9A9A9A">Nhập mật khẩu</div></div>
      </div>
      <input class="pi" type="password" id="pwi" placeholder="Mật khẩu..." onkeydown="if(event.key==='Enter')doLogin()">
      <button class="lb" onclick="doLogin()">Đăng nhập</button>
      <div class="le" id="lerr"></div>
      <button class="bb" onclick="goBack()">← Chọn lại</button>
    </div>
  </div>

// SHA-256 hash cho mật khẩu (không lưu mật khẩu thô lên Firebase)
async function sha256(s){
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function verifyPw(u, input){
  if(!DB) return input===u.pw;
  try{
    const snap=await get(ref(DB,'passwords/'+u.id));
    const stored=snap.val();
    if(stored) return (await sha256(input))===stored;  // đã đổi -> so hash
    return input===u.pw;                                // chưa đổi -> so mặc định
  }catch(e){ return input===u.pw; }
}

function allowedIDs(){ return (curU&&curU.role==='member'&&Array.isArray(curU.allow))?curU.allow:IDS; }

// ── HELPERS ──
function tTier(von){
  if(von>=3e9) return'vip';
  if(von>=1e9) return'diamond';
  if(von>=3e8) return'gold';
  return'none';
}
function tLimit(vip){
  if(vip==='vip') return 5;
  if(vip==='diamond') return 7;
  if(vip==='gold') return 10;
  return 15;
}
function tierNote(t){ return t==='vip'?'⏰ Nhắc mỗi 5 ngày':t==='dia'?'⏰ Nhắc mỗi 7 ngày':t==='gold'?'⏰ Nhắc mỗi 10 ngày':t==='thu'?'⏰ Nhắc mỗi 15 ngày':''; }
function dDays(s){
  if(!s) return 999;
  const p=s.split('/');
  if(p.length!==3) return 999;
  return Math.floor((Date.now()-new Date(+p[2],+p[1]-1,+p[0]).getTime())/86400000);
}
function reminderDue(c){
  if(!c.nhacNgay) return false;
  const p=String(c.nhacNgay).split('/'); if(p.length!==3) return false;
  const due=new Date(+p[2],+p[1]-1,+p[0]); due.setHours(0,0,0,0);
  const t=new Date(); t.setHours(0,0,0,0);
  return t>=due;
}
function needMsg(c){ return dDays(c.ngay)>=tLimit(c.vip||'none') || reminderDue(c); }
function daysLeft(c){ return tLimit(c.vip||'none')-dDays(c.ngay); } // >0 còn hạn, <=0 quá hạn
function isOverdue(c){ return !!c.ngay && daysLeft(c)<=0; } // đã quá hạn — đỏ
function isSoonDue(c){ return !!c.ngay && daysLeft(c)>0 && daysLeft(c)<=2; } // sắp quá hạn (còn 1-2 ngày) — vàng
function todayS(){ const t=new Date(); return t.getDate()+'/'+(t.getMonth()+1)+'/'+t.getFullYear(); }
// Trạng thái dùng chung cho bảng, thẻ, kanban
function statusHtml(c){
  const d=dDays(c.ngay), lim=tLimit(c.vip||'none'), left=lim-d;
  if(!c.ngay) return '<span class="st-no">Chưa nhắn</span>';
  if(left<=0) return `<span class="st-late"><i class="ti ti-alert-triangle" style="font-size:10px"></i>Quá hạn ${Math.abs(left)}n<span class="days-pill" style="background:#C62828;color:#fff">${d}/${lim}</span></span>`;
  if(left<=2) return `<span class="st-soon"><i class="ti ti-clock" style="font-size:10px"></i>Còn ${left}n<span class="days-pill" style="background:#F9A825;color:#3a2c00">${d}/${lim}</span></span>`;
  return `<span class="st-ok"><i class="ti ti-check" style="font-size:10px"></i>Còn ${left}n<span class="days-pill" style="background:#C8E6C9;color:#1B5E20">${d}/${lim}</span></span>`;
}

function buildNameIndexes(){
  // Dựng chỉ mục tên(+ID)→mã khách để nhận diện lại các log CŨ chưa lưu kèm mã khách (ck)
  const byId={}, byName={}, idCnt={}, nameCnt={};
  Object.entries(C).forEach(([k,c])=>{
    const nm=(c.hoTen||'').trim().toLowerCase(); if(!nm) return;
    const id=(c.idNhom||'').trim().toLowerCase();
    const kId=nm+'|'+id;
    idCnt[kId]=(idCnt[kId]||0)+1; byId[kId]=k;
    nameCnt[nm]=(nameCnt[nm]||0)+1; byName[nm]=k;
  });
  Object.keys(idCnt).forEach(k=>{ if(idCnt[k]>1) delete byId[k]; }); // bỏ nếu trùng tên+ID (không chắc chắn)
  Object.keys(nameCnt).forEach(k=>{ if(nameCnt[k]>1) delete byName[k]; }); // bỏ nếu trùng tên hoàn toàn
  return {byId,byName};
}
function resolveCk(l, idx){
  if(l.ck) return l.ck; // log mới đã lưu sẵn mã khách
  if(!l.detail) return '';
  if(l.action==='update'){
    const m=l.detail.match(RE_LOG_UPDATE);
    if(m){ const nm=m[1].trim().toLowerCase(), id=m[2].trim().toLowerCase();
      return idx.byId[nm+'|'+id] || idx.byName[nm] || ''; }
  } else if(l.action==='note'){
    const m=l.detail.match(RE_LOG_NOTE);
    if(m){ return idx.byName[m[1].trim().toLowerCase()] || ''; }
  }
  return '';
}
// ── NGÀY NGHỈ (cuối tuần + lễ VN) — dùng để tô nền mờ trên biểu đồ xu hướng ──
const VN_FIXED_HOLIDAYS=[{m:1,d:1,name:'Tết Dương lịch'},{m:4,d:30,name:'Ngày Thống nhất'},{m:5,d:1,name:'Quốc tế Lao động'},{m:9,d:1,name:'Nghỉ bù Quốc khánh'},{m:9,d:2,name:'Quốc khánh'}];
// Tết Âm lịch đổi ngày dương lịch mỗi năm nên cần cập nhật thủ công theo từng năm
const VN_LUNAR_HOLIDAYS_BY_YEAR={2026:[['2026-2-14','2026-2-22','Tết Nguyên Đán Bính Ngọ']]};
function isWeekendDay(d){ const wd=d.getDay(); return wd===0||wd===6; }
function vnHolidayName(d){
  const m=d.getMonth()+1, day=d.getDate(), y=d.getFullYear();
  const fx=VN_FIXED_HOLIDAYS.find(h=>h.m===m&&h.d===day); if(fx) return fx.name;
  const ranges=VN_LUNAR_HOLIDAYS_BY_YEAR[y]||[];
  for(const [s,e,name] of ranges){
    const [sy,sm,sd]=s.split('-').map(Number), [ey,em,ed]=e.split('-').map(Number);
    const sD=new Date(sy,sm-1,sd), eD=new Date(ey,em-1,ed);
    if(d>=sD&&d<=eD) return name;
  }
  return '';
}
window.setReportRange=function(r){ reportRange=r; rReport(); };

function rReport(){
  const all=getAll();
  const overdue=all.filter(c=>needMsg(c)).length;
  const contacted=all.filter(c=>c.ngay).length;
  const rate=all.length?Math.round((all.length-overdue)/all.length*100):100;
  const nameIdx=buildNameIndexes();
  // Hiệu suất thành viên (30 ngày gần nhất, từ nhật ký hoạt động — theo tài khoản đăng nhập)
  const since=Date.now()-30*86400000;
  const recent=LOGS.filter(l=>l.time>=since);
  const perM={}; USERS.forEach(u=>perM[u.name]={nhac:0,note:0,confirm:0,edit:0,total:0,color:u.color,custSet:new Set()});
  recent.forEach(l=>{const m=l.by; if(!m||!perM[m])return; perM[m].total++;
    if(l.action==='update')perM[m].nhac++; else if(l.action==='note')perM[m].note++;
    else if(l.action==='confirm')perM[m].confirm++; else if(l.action==='add'||l.action==='edit'||l.action==='import')perM[m].edit++;
    if(l.action==='update'||l.action==='note'){ const ck=resolveCk(l,nameIdx); if(ck) perM[m].custSet.add(ck); }});
  const maxT=Math.max(1,...Object.values(perM).map(x=>x.total));
  // Xu hướng chăm sóc theo TỪNG NGÀY — theo khoảng thời gian đã chọn (7/30/tất cả)
  let minTs=null;
  LOGS.forEach(l=>{
    if(l.action!=='update'&&l.action!=='note') return;
    if(!resolveCk(l,nameIdx)) return;
    if(minTs===null||l.time<minTs) minTs=l.time;
  });
  const today=new Date(); today.setHours(0,0,0,0);
  let startDay;
  if(reportRange==='7') startDay=new Date(today.getTime()-6*86400000);
  else if(reportRange==='30') startDay=new Date(today.getTime()-29*86400000);
  else { // 'all' — từ ngày dữ liệu sớm nhất, giới hạn tối đa 180 ngày để tránh quá dày
    startDay=minTs?new Date(minTs):new Date(today); startDay.setHours(0,0,0,0);
    const cap=new Date(today.getTime()-180*86400000);
    if(startDay<cap) startDay=cap;
  }
  const nDays=Math.max(1,Math.floor((today-startDay)/86400000)+1);
  const dayLabs=[], dayKeys=[], dayMeta=[];
  for(let i=0;i<nDays;i++){
    const d=new Date(startDay.getTime()+i*86400000);
    dayLabs.push(d.getDate()+'/'+(d.getMonth()+1));
    dayKeys.push(d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate());
    const hol=vnHolidayName(d);
    dayMeta.push({off:isWeekendDay(d)||!!hol, holiday:!!hol});
  }
  const dayIdxOf={}; dayKeys.forEach((k,i)=>dayIdxOf[k]=i);
  const dayTrend={}, rangeCustSet={}; USERS.forEach(u=>{dayTrend[u.name]=dayKeys.map(()=>new Set()); rangeCustSet[u.name]=new Set();});
  LOGS.forEach(l=>{
    if(!l.by||!dayTrend[l.by]) return;
    if(l.action!=='update'&&l.action!=='note') return;
    if(l.time<startDay.getTime()) return;
    const ck=resolveCk(l,nameIdx); if(!ck) return;
    rangeCustSet[l.by].add(ck);
    const ld=new Date(l.time); const lk=ld.getFullYear()+'-'+ld.getMonth()+'-'+ld.getDate();
    const idx=dayIdxOf[lk]; if(idx!==undefined) dayTrend[l.by][idx].add(ck);
  });
  const trendRangeLabel=dayLabs.length?`${dayLabs[0]} → ${dayLabs[dayLabs.length-1]}`:'';
  const rangeText=reportRange==='7'?'7 ngày gần nhất':reportRange==='30'?'30 ngày gần nhất':'tất cả (tối đa 180 ngày)';
  // Nguồn khách
  const src={}; all.forEach(c=>{const s=(c.nguon||'').trim()||'(chưa ghi nguồn)'; if(!src[s])src[s]={n:0,von:0,vip:0}; src[s].n++; src[s].von+=(c.von||0); if(c.vip==='vip')src[s].vip++;});
  const srcArr=Object.entries(src).sort((a,b)=>b[1].von-a[1].von);

  let h=`<div class="stats">
    <div class="stat"><div class="stat-l"><i class="ti ti-checklist" style="font-size:12px"></i>Tỷ lệ đúng hạn</div><div class="stat-v" style="color:${rate>=80?'var(--green)':rate>=60?'var(--amber)':'#C62828'}">${rate}%</div><div class="stat-s">${all.length-overdue}/${all.length} còn hạn</div></div>
    <div class="stat"><div class="stat-l" style="color:var(--amber)"><i class="ti ti-bell" style="font-size:12px"></i>Đang quá hạn</div><div class="stat-v" style="color:var(--amber)">${overdue}</div><div class="stat-s">khách cần nhắn</div></div>
    <div class="stat"><div class="stat-l"><i class="ti ti-address-book" style="font-size:12px"></i>Đã từng liên hệ</div><div class="stat-v">${contacted}</div><div class="stat-s">có ngày nhắn</div></div>
    <div class="stat"><div class="stat-l"><i class="ti ti-activity" style="font-size:12px"></i>Hoạt động 30 ngày</div><div class="stat-v">${recent.length}</div><div class="stat-s">thao tác chăm sóc</div></div>
  </div>`;

  h+=`<div class="chcard" style="margin-bottom:16px"><h4><i class="ti ti-user-star"></i> Hiệu suất thành viên (30 ngày gần nhất)</h4>
    <div class="tc"><table><thead><tr><th>Thành viên</th><th>Nhắn KH</th><th>Nhật ký</th><th>Xác nhận</th><th>Thêm/Sửa</th><th>Tổng</th><th>Khách duy nhất</th><th style="width:24%">Mức độ</th></tr></thead><tbody>`;
  Object.entries(perM).sort((a,b)=>b[1].total-a[1].total).forEach(([nm,x])=>{
    h+=`<tr><td><b style="color:${x.color}">${nm}</b></td><td>${x.nhac}</td><td>${x.note}</td><td>${x.confirm}</td><td>${x.edit}</td><td><b>${x.total}</b></td><td><b>${x.custSet.size}</b></td>
      <td><div class="pb" style="height:8px"><div class="pf" style="width:${Math.round(x.total/maxT*100)}%;background:${x.color};height:8px"></div></div></td></tr>`;
  });
  h+=`</tbody></table></div><div style="font-size:11px;color:var(--text3);margin-top:6px;font-style:italic">* Tính từ nhật ký hoạt động theo tài khoản đăng nhập của từng người. "Khách duy nhất" = số khách hàng khác nhau đã nhắn/ghi nhật ký (không tính trùng nếu nhắn lại cùng 1 khách nhiều lần).</div></div>`;

  h+=`<div class="fr" style="margin-bottom:10px">
    <span style="font-size:11px;color:var(--text3);margin-right:2px">Khoảng thời gian biểu đồ:</span>
    <button class="fb${reportRange==='7'?' on':''}" onclick="setReportRange('7')">7 ngày</button>
    <button class="fb${reportRange==='30'?' on':''}" onclick="setReportRange('30')">30 ngày</button>
    <button class="fb${reportRange==='all'?' on':''}" onclick="setReportRange('all')">Tất cả</button>
  </div>
  <div class="chgrid" style="margin-bottom:16px">
    <div class="chcard"><h4><i class="ti ti-chart-bar"></i> Số khách duy nhất đã chăm sóc (${rangeText})</h4><div class="chwrap" style="height:210px"><canvas id="chMemberBar"></canvas></div></div>
    <div class="chcard"><h4><i class="ti ti-trending-up"></i> Xu hướng theo ngày${trendRangeLabel?' ('+trendRangeLabel+')':''}</h4><div class="chwrap" style="height:210px"><canvas id="chMemberTrend"></canvas></div></div>
  </div>
  <div style="font-size:11px;color:var(--text3);margin-top:-8px;margin-bottom:16px;font-style:italic">* Cả 2 biểu đồ tính theo tài khoản đăng nhập thực hiện thao tác — đúng bản chất vì cả team nhắn linh hoạt giữa các ID, không gán cố định ai quản ID nào. Với các nhật ký từ trước khi có bản cập nhật này, hệ thống tự nhận diện lại khách hàng qua tên (và ID) ghi trong nội dung nhật ký — nếu 2 khách trùng tên hoàn toàn hoặc khách đã đổi tên sau đó, log đó sẽ không tính được vào số liệu. Nền xám nhạt = thứ Bảy/Chủ nhật, nền đỏ nhạt = ngày lễ Việt Nam — số liệu tự nhiên thấp vào những ngày này không có nghĩa là ai đó đang lơ là. Rê chuột vào từng ngày để xem chính xác ai đã chăm sóc bao nhiêu khách hôm đó.</div>`;

  h+=`<div class="chgrid">
    <div class="chcard"><h4><i class="ti ti-target"></i> Tỷ lệ đúng hạn theo ID</h4><div class="tc"><table><thead><tr><th>ID</th><th>KH</th><th>Quá hạn</th><th>Đúng hạn</th></tr></thead><tbody>`;
  visibleIDs().forEach(id=>{const ks=all.filter(c=>c.idNhom===id);const od=ks.filter(c=>needMsg(c)).length;const r=ks.length?Math.round((ks.length-od)/ks.length*100):100;
    h+=`<tr><td><span class="id-c">${id}</span></td><td>${ks.length}</td><td style="color:${od>0?'#C62828':'var(--text3)'}">${od}</td><td style="color:${r>=80?'var(--green)':'var(--amber)'};font-weight:600">${r}%</td></tr>`;});
  h+=`</tbody></table></div></div>
    <div class="chcard"><h4><i class="ti ti-affiliate"></i> Phân tích nguồn khách</h4><div class="tc"><table><thead><tr><th>Nguồn</th><th>KH</th><th>Tổng vốn</th><th>VIP</th></tr></thead><tbody>`;
  srcArr.forEach(([s,x])=>{h+=`<tr><td style="font-size:12px">${s}</td><td>${x.n}</td><td style="font-size:12px">${(x.von/1e9).toFixed(2)}B</td><td>${x.vip}</td></tr>`;});
  h+=`</tbody></table></div><div style="font-size:11px;color:var(--text3);margin-top:6px;font-style:italic">* Điền "Nguồn khách hàng" khi thêm/sửa để phân tích nguồn nào ra khách chất lượng.</div></div>
  </div>`;
  document.getElementById('MC').innerHTML=h;
  drawMemberChart(rangeCustSet, dayTrend, dayLabs, dayMeta);
}

// ── PHỄU KANBAN ──
function kanCard(c){
  const tb=c.vip==='vip'?'<span class="t-vip" style="font-size:10px"><i class="ti ti-crown" style="font-size:9px"></i>VIP</span>':
    c.vip==='diamond'?'<span class="t-dia" style="font-size:10px"><i class="ti ti-diamond" style="font-size:9px"></i>Dia</span>':
    c.vip==='gold'?'<span class="t-gold" style="font-size:10px"><i class="ti ti-medal" style="font-size:9px"></i>Gold</span>':
    '<span class="t-thu" style="font-size:10px">Thường</span>';
  const sel=`<select class="kan-sel" onchange="kanMove('${c._k}',this.value)" onclick="event.stopPropagation()">${STAGES.map(s=>`<option value="${s.k}"${getStage(c)===s.k?' selected':''}>➜ ${s.t}</option>`).join('')}</select>`;
  const urg=isOverdue(c)?' <span title="Đã quá hạn" style="color:#C62828">●</span>':isSoonDue(c)?' <span title="Sắp quá hạn" style="color:#F9A825">●</span>':needMsg(c)?' <span title="Cần nhắn" style="color:#C62828">●</span>':'';
  return`<div class="kan-card" draggable="true" ondragstart="kanDrag(event,'${c._k}')" onclick="openSP('${c._k}')">
    <div class="kan-nm">${c.hoTen||''}${urg}</div>
    <div class="kan-meta"><span class="id-c">${c.idNhom||''}</span> ${tb}</div>
    <div class="kan-von">${c.von?Math.round(c.von).toLocaleString('vi-VN')+'đ':'—'}</div>
    ${sel}
  </div>`;
}
function rKanban(){
  const all=getAll();
  const list=kanID?all.filter(c=>c.idNhom===kanID):all;
  let h=`<div class="advbar"><label>Lọc ID:</label>
    <select onchange="setKanID(this.value)"><option value="">Tất cả (${all.length})</option>${visibleIDs().map(id=>`<option value="${id}"${kanID===id?' selected':''}>${id} (${all.filter(c=>c.idNhom===id).length})</option>`).join('')}</select>
    <span style="font-size:11px;color:var(--text3)"><i class="ti ti-info-circle"></i> Kéo thẻ sang cột khác, hoặc dùng ô "➜" trên thẻ. Bấm thẻ để xem/nhật ký. ● đỏ = đã quá hạn, ● vàng = sắp quá hạn.</span></div>`;
  h+=`<div class="kan">`;
  STAGES.forEach(s=>{
    const items=list.filter(c=>getStage(c)===s.k).sort((a,b)=>(b.von||0)-(a.von||0));
    const tot=items.reduce((x,c)=>x+(c.von||0),0);
    const cap=items.slice(0,60);
    h+=`<div class="kan-col" ondragover="kanOver(event,this)" ondragleave="this.classList.remove('drop')" ondrop="kanDrop(event,'${s.k}',this)">
      <div class="kan-h" style="border-top:3px solid ${s.c}"><span style="color:${s.c}"><i class="ti ${s.i}"></i> ${s.t}</span><span class="kan-cnt">${items.length}</span></div>
      <div class="kan-sub">💰 ${(tot/1e9).toFixed(2)}B</div>
      <div class="kan-body">${cap.map(c=>kanCard(c)).join('')||'<div class="kan-empty">Kéo thẻ vào đây</div>'}${items.length>60?`<div class="kan-more">+${items.length-60} khách nữa…</div>`:''}</div>
    </div>`;
  });
  h+=`</div>`;
  document.getElementById('MC').innerHTML=h;
}
window.setKanID=function(v){ kanID=v; refresh(); };
let _dragKey=null;
window.kanDrag=function(e,key){ _dragKey=key; try{e.dataTransfer.setData('text/plain',key);e.dataTransfer.effectAllowed='move';}catch(x){} };
window.kanOver=function(e,el){ e.preventDefault(); el.classList.add('drop'); };
window.kanDrop=function(e,stage,el){ e.preventDefault(); if(el)el.classList.remove('drop'); let key=''; try{key=e.dataTransfer.getData('text/plain');}catch(x){} key=key||_dragKey; if(key)kanMove(key,stage); _dragKey=null; };
window.kanMove=function(key,stage){
  const c=C[key]||{};
  if(getStage(c)===stage){ refresh(); return; }
  if(DB) update(ref(DB,'customers/'+key),{stage});
  C[key]={...c,stage};
  addLog('edit','Chuyển '+(c.hoTen||'')+' → '+stageName(stage));
  showToast('Đã chuyển: '+(c.hoTen||'')+' → '+stageName(stage),'ok');
  updateNav(); refresh();
};

// ── ADVANCED FILTER (trang "Tất cả") ──
window.setAdv=function(k,v){ if(k==='tier')advTier=v; if(k==='id')advID=v; if(k==='stat')advStat=v; refresh(); };
function applyAdv(list){
  let r=list;
  if(advTier) r=r.filter(c=>(advTier==='none'?(!c.vip||c.vip==='none'):c.vip===advTier));
  if(advID) r=r.filter(c=>c.idNhom===advID);
  if(advStat==='urg') r=r.filter(c=>needMsg(c));
  else if(advStat==='ok') r=r.filter(c=>c.ngay&&!needMsg(c));
  else if(advStat==='new') r=r.filter(c=>!c.ngay);
  return r;
}

// ── RENDER SIMPLE ──

      </select>
      <select onchange="setAdv('stat',this.value)">
        <option value="">— Trạng thái —</option>
        <option value="urg"${advStat==='urg'?' selected':''}>Cần nhắn ngay</option>
        <option value="ok"${advStat==='ok'?' selected':''}>Còn hạn</option>
        <option value="new"${advStat==='new'?' selected':''}>Chưa nhắn</option>
      </select>
      <span style="font-size:11px;color:var(--text3)">${show.length} khách</span>

  const idBtns=(['vip','dia','gold','thu','urg'].includes(type))?

      <span style="font-size:11px;color:var(--text3)">Lọc ID:</span>
      ${visibleIDs().map(id=>{const cnt=list.filter(c=>c.idNhom===id).length;return cnt>0?`<button class="fb${curF===id?' on':''}" onclick="setF('${id}')">${id}(${cnt})</button>`:''}).join('')}
    </div>`:'';

  document.getElementById('MC').innerHTML=idBtns+`<div class="fr">

    <button class="fb${curF==='ok'?' on':''}" onclick="setF('ok')">Còn hạn(${ok})</button>
    ${note?`<span style="font-size:11px;color:var(--text3);font-style:italic">${note}</span>`:''}
    <span style="margin-left:auto">${viewToggleHtml()}</span>
  </div>

// ── RENDER ID ──
function rID(list){
  const urg=list.filter(c=>needMsg(c)).length;
  const ok=list.filter(c=>c.ngay&&!needMsg(c)).length;

  let cb='';
  const conf=localStorage.getItem('cf_'+curID+'_'+todayS());
  if(urg>0&&!conf) cb=`<div class="cb"><div style="font-size:20px">📋</div><div class="cb-i"><div class="cb-t">Còn ${urg} khách chưa nhắn trong ${curID}</div><div class="cb-s">Nhắn xong → xác nhận để lưu ngày hôm nay</div></div><button class="btn-cf" onclick="cfID('${curID}')">✓ Xác nhận đã nhắn hết</button></div>`;
  else if(conf) cb=`<div class="cb done"><div>✅</div><div class="cb-i"><div class="cb-t done">${curID} — Hoàn thành hôm nay!</div><div class="cb-s">Xác nhận lúc ${conf}</div></div></div>`;

  if(curF!=='all'){
    const fl=curF==='urg'?list.filter(c=>needMsg(c)):list.filter(c=>c.ngay&&!needMsg(c));
    document.getElementById('MC').innerHTML=cb+`<div class="fr">
      <button class="fb" onclick="setF('all')">Tất cả(${list.length})</button>
      <button class="fb on">${curF==='urg'?'Cần nhắn':'Còn hạn'}(${fl.length})</button>
      <span style="margin-left:auto">${viewToggleHtml()}</span>
    </div>${buildList(fl)}`;
    return;
  }

  const V=list.filter(c=>c.vip==='vip');
  const D=list.filter(c=>c.vip==='diamond');
  const G=list.filter(c=>c.vip==='gold');
  const T=list.filter(c=>!c.vip||c.vip==='none');

  const sec=(title,bg,bd,col,icon,rows)=>rows.length===0?'':
    `<div class="tsec" style="background:${bg};border:1.5px solid ${bd}">
      <div class="tsec-t" style="color:${col}"><i class="ti ti-${icon}"></i>${title}(${rows.length})</div>
      ${buildList(rows)}
    </div>`;

  document.getElementById('MC').innerHTML=cb+`<div class="fr">
    <button class="fb on">Tất cả(${list.length})</button>
    <button class="fb${urg>0?' ':''}" onclick="setF('urg')" style="${urg>0?'color:var(--amber)':''}">Cần nhắn(${urg})</button>
    <button class="fb" onclick="setF('ok')">Còn hạn(${ok})</button>
    <span style="margin-left:auto">${viewToggleHtml()}</span>
  </div>`+
  sec('VIP — trên 3 tỷ (nhắc 5 ngày)','#FFF3E0','#FF6D00','#BF360C','crown',V)+
  sec('Diamond — 1 tỷ đến 3 tỷ (nhắc 7 ngày)','#F3E5F5','#AB47BC','#6A1B9A','diamond',D)+
  sec('Gold — 300tr đến 1 tỷ (nhắc 10 ngày)','#FFF8E1','#FFB300','#E65100','medal',G)+
  sec('Thường — dưới 300 triệu (nhắc 15 ngày)','#F5F5F3','#BDBDBD','#555','user',T);
}

function rDash(){
  const all=getAll();
  const urg=getUrg();
  const vips=all.filter(c=>c.vip==='vip');
  const totalV=all.reduce((s,c)=>s+(c.von||0),0);
  let h=`<div class="stats">
    <div class="stat"><div class="stat-l"><i class="ti ti-users" style="font-size:12px"></i>Tổng khách</div><div class="stat-v">${all.length}</div><div class="stat-s">${visibleIDs().length} ID</div></div>
    <div class="stat"><div class="stat-l" style="color:var(--amber)"><i class="ti ti-bell" style="font-size:12px"></i>Cần nhắn</div><div class="stat-v" style="color:var(--amber)">${urg.length}</div><div class="stat-s">Quá hạn nhắn</div></div>
    <div class="stat"><div class="stat-l" style="color:#BF360C"><i class="ti ti-crown" style="font-size:12px"></i>Khách VIP</div><div class="stat-v" style="color:#BF360C">${vips.length}</div><div class="stat-s">${all.filter(c=>c.vip==='diamond').length} Diamond</div></div>
    <div class="stat"><div class="stat-l" style="color:var(--green)"><i class="ti ti-currency-dong" style="font-size:12px"></i>Tổng vốn</div><div class="stat-v" style="font-size:18px;color:var(--green)">${(totalV/1e9).toFixed(1)}B</div><div class="stat-s">VNĐ</div></div>
  </div>`;
  h+=`<div class="chgrid">
    <div class="chcard"><h4>Phân bổ khách theo hạng</h4><div class="chwrap"><canvas id="chTier"></canvas></div></div>
    <div class="chcard"><h4>Xu hướng chăm sóc (8 tuần gần nhất)</h4><div class="chwrap"><canvas id="chWeek"></canvas></div></div>
  </div>`;
  if(urg.length){
    const tc=localStorage.getItem('cf_'+todayS());
    if(!tc) h+=`<div class="cb"><div style="font-size:20px">📋</div><div class="cb-i"><div class="cb-t">Còn ${urg.length} khách cần nhắn hôm nay</div><div class="cb-s">Nhắn xong tất cả → xác nhận</div></div><button class="btn-cf" onclick="cfAll()">✓ Xác nhận đã nhắn hết</button></div>`;
    else h+=`<div class="cb done"><div>✅</div><div class="cb-i"><div class="cb-t done">Đã hoàn thành nhắn tin hôm nay!</div><div class="cb-s">Xác nhận lúc ${tc}</div></div></div>`;
    h+=`<div style="font-family:var(--serif);font-size:14px;font-weight:700;margin-bottom:10px;color:var(--amber)"><i class="ti ti-alert-circle"></i> Cần nhắn hôm nay(${urg.length})</div><div class="tc" style="margin-bottom:16px">${buildRows(urg.slice(0,8))}</div>`;
  }
  h+=`<div style="font-family:var(--serif);font-size:14px;font-weight:700;margin-bottom:10px">Tình trạng từng ID</div><div class="ig">`;
  visibleIDs().forEach((id,i)=>{
    const ks=all.filter(c=>c.idNhom===id);
    const u=ks.filter(c=>needMsg(c)).length;
    const od=ks.filter(c=>isOverdue(c)).length;
    const col=IDCOLS[i%IDCOLS.length];
    const pct=ks.length?Math.round((ks.length-u)/ks.length*100):100;
    h+=`<div class="ic" onclick="gID('${id}')">
      <div class="ic-h"><div class="ic-n" style="color:${col}">${id}</div>${od>0?`<span class="st-late"><i class="ti ti-alert-triangle" style="font-size:10px"></i>${od}</span>`:u>0?`<span class="st-warn"><i class="ti ti-alert-circle" style="font-size:10px"></i>${u}</span>`:`<span class="st-ok"><i class="ti ti-check" style="font-size:10px"></i>OK</span>`}</div>
      <div class="ic-s"><div class="ic-ss"><span>${ks.length}</span> khách</div><div class="ic-ss"><span>${(ks.reduce((s,c)=>s+(c.von||0),0)/1e9).toFixed(1)}B</span></div></div>
      <div class="pb"><div class="pf" style="width:${pct}%;background:${od>0?'#C62828':u>0?'#D4A017':col}"></div></div>
    </div>`;
  });
  h+='</div>';
  document.getElementById('MC').innerHTML=h;
  drawCharts(all);
}

function drawCharts(all){
  const dark=document.body.classList.contains('dark');
  const grid=dark?'rgba(255,255,255,.08)':'rgba(0,0,0,.06)';
  const txt=dark?'#B3B3B3':'#5A5A5A';
  if(chTier){chTier.destroy();chTier=null;}
  if(chWeek){chWeek.destroy();chWeek=null;}
  const te=document.getElementById('chTier'), we=document.getElementById('chWeek');
  if(!te||!we||!window.Chart) return;
  const cnt=[all.filter(c=>c.vip==='vip').length,all.filter(c=>c.vip==='diamond').length,all.filter(c=>c.vip==='gold').length,all.filter(c=>!c.vip||c.vip==='none').length];
  chTier=new Chart(te,{type:'doughnut',data:{labels:['VIP','Diamond','Gold','Thường'],datasets:[{data:cnt,backgroundColor:['#FF6D00','#AB47BC','#FFB300','#9E9E9E'],borderWidth:2,borderColor:dark?'#181818':'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:txt,font:{size:11},boxWidth:12}}}}});
  // xu hướng: số khách được nhắn theo 8 tuần (dựa vào ngay)
  const now=new Date(); const buckets=new Array(8).fill(0); const labs=[];
  for(let i=7;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i*7);labs.push('T'+(d.getDate())+'/'+(d.getMonth()+1));}
  all.forEach(c=>{
    if(!c.ngay) return; const p=c.ngay.split('/'); if(p.length!==3) return;
    const d=new Date(+p[2],+p[1]-1,+p[0]); const diff=Math.floor((now-d)/86400000);
    if(diff<0) return; const wk=Math.floor(diff/7); if(wk<8) buckets[7-wk]++;
  });
  chWeek=new Chart(we,{type:'bar',data:{labels:labs,datasets:[{label:'Khách được nhắn',data:buckets,backgroundColor:'#1ed760',borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:txt,font:{size:10}}},y:{grid:{color:grid},ticks:{color:txt,precision:0,font:{size:10}},beginAtZero:true}}}});
}

// ── BIỂU ĐỒ HIỆU SUẤT THEO THÀNH VIÊN (khách duy nhất đã chăm sóc + xu hướng theo ngày) ──
function weekendHolidayPlugin(meta){
  return {
    id:'weekendHolidayShade',
    beforeDatasetsDraw(chart){
      const area=chart.chartArea, xScale=chart.scales.x;
      if(!area||!xScale||!meta||!meta.length) return;
      const ctx=chart.ctx, n=meta.length;
      const bw=xScale.width/n;
      ctx.save();
      meta.forEach((m,i)=>{
        if(!m.off) return;
        const center=xScale.getPixelForValue(i);
        ctx.fillStyle=m.holiday?'rgba(198,40,40,.09)':'rgba(90,90,90,.09)';
        ctx.fillRect(center-bw/2, area.top, bw, area.bottom-area.top);
      });
      ctx.restore();
    }
  };
}
function drawMemberChart(rangeCustSet, dayTrend, dayLabs, dayMeta){
  const dark=document.body.classList.contains('dark');
  const grid=dark?'rgba(255,255,255,.08)':'rgba(0,0,0,.06)';
  const txt=dark?'#B3B3B3':'#5A5A5A';
  if(chMember){chMember.destroy();chMember=null;}
  if(chMemberTrend){chMemberTrend.destroy();chMemberTrend=null;}
  const barEl=document.getElementById('chMemberBar');
  const trendEl=document.getElementById('chMemberTrend');
  if(!window.Chart) return;
  const labels=USERS.map(u=>u.name);
  const colors=USERS.map(u=>u.color);
  if(barEl){
    const data=USERS.map(u=>rangeCustSet[u.name]?rangeCustSet[u.name].size:0);
    chMember=new Chart(barEl,{type:'bar',data:{labels,datasets:[{label:'Khách duy nhất',data,backgroundColor:colors,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:txt,font:{size:12,weight:'600'}}},y:{grid:{color:grid},ticks:{color:txt,precision:0,font:{size:10}},beginAtZero:true}}}});
  }
  if(trendEl){
    const datasets=USERS.map(u=>({label:u.name,data:(dayTrend[u.name]||[]).map(s=>s.size),borderColor:u.color,backgroundColor:u.color,tension:.25,fill:false,pointRadius:3,pointHoverRadius:5}));
    chMemberTrend=new Chart(trendEl,{type:'line',data:{labels:dayLabs,datasets},plugins:[weekendHolidayPlugin(dayMeta)],options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{color:txt,font:{size:11},boxWidth:12}},tooltip:{mode:'index',intersect:false,callbacks:{title:(items)=>{const i=items[0].dataIndex;const m=dayMeta&&dayMeta[i];return 'Ngày '+items[0].label+(m&&m.holiday?' — Ngày lễ':m&&m.off?' — Cuối tuần':'');}}}},scales:{x:{grid:{display:false},ticks:{color:txt,font:{size:10},autoSkip:false,maxRotation:60,minRotation:dayLabs.length>10?45:0}},y:{grid:{color:grid},ticks:{color:txt,precision:0,font:{size:10}},beginAtZero:true}}}});
  }
}

// ── BUILD ROWS ──
function buildRows(list){
  list = [...list].sort((a,b)=>(b.von||0)-(a.von||0));
  if(!list.length) return`<div class="empty"><i class="ti ti-inbox" style="font-size:26px;display:block;margin-bottom:8px"></i>Không có dữ liệu</div>`;
  return`<table><thead><tr><th>Khách hàng</th><th>SĐT</th><th>STK</th><th>Số vốn</th><th>ID</th><th>Hạng</th><th>Lần nhắn</th><th>Trạng thái</th><th></th></tr></thead><tbody>${
  list.map(c=>{
    const d=dDays(c.ngay), lim=tLimit(c.vip||'none'), left=lim-d;
    const st=statusHtml(c);
    const ini=c.hoTen?c.hoTen.split(' ').slice(-2).map(w=>w[0]).join('').toUpperCase():'?';
    const tb=c.vip==='vip'?'<span class="t-vip"><i class="ti ti-crown" style="font-size:10px"></i>VIP</span>':
      c.vip==='diamond'?'<span class="t-dia"><i class="ti ti-diamond" style="font-size:10px"></i>Diamond</span>':
      c.vip==='gold'?'<span class="t-gold"><i class="ti ti-medal" style="font-size:10px"></i>Gold</span>':
      '<span class="t-thu"><i class="ti ti-user" style="font-size:10px"></i>Thường</span>';
    const key=c._k;
    const hn=c.hoTen?c.hoTen.replace(/'/g,"\\'"):'';
    const id=c.idNhom||'';
    const note=c.ghiChu||'';
    const noteEsc=note.replace(/"/g,'&quot;');
    const sd=(c.sdt||'').replace(/[^\d+]/g,'');
    const phone=c.sdt?`<a href="tel:${sd}" style="color:var(--blue);text-decoration:none">${c.sdt}</a> <a href="https://zalo.me/${sd}" target="_blank" title="Nhắn Zalo" style="text-decoration:none">💬</a>`:'—';
    const rem=c.nhacNgay?`<div style="font-size:10px;margin-top:2px;color:${reminderDue(c)?'#C62828':'var(--text3)'}">⏰ Hẹn ${c.nhacNgay}</div>`:'';
    return`<tr>
      <td><div class="nc"><div class="av${c.vip&&c.vip!=='none'?' vav':''}">${ini}</div>
        <div><div class="nbold">${c.hoTen||''}</div>${note?`<div class="note-p" onclick="openSP('${key}')" title="${noteEsc}">📝 ${note}</div>`:''}</div>
      </div></td>
      <td style="font-family:monospace;font-size:12px">${phone}</td>
      <td style="font-family:monospace;font-size:12px">${c.stk||'—'}</td>
      <td style="font-size:12px">${c.von?Math.round(c.von).toLocaleString('vi-VN')+'đ':'—'}</td>
      <td><span class="id-c">${id}</span></td>
      <td>${tb}</td>
      <td style="font-size:12px;font-style:italic">${c.ngay||'—'}</td>
      <td>${st}${rem}</td>
      <td><div style="display:flex;gap:3px;flex-wrap:nowrap">
        <button class="ab an" onclick="doMsg('${key}','${hn}','${id}')" title="Nhắn hôm nay"><i class="ti ti-message"></i></button>
        <button class="ab" onclick="openModal('${key}')" title="Sửa"><i class="ti ti-edit"></i></button>
        <button class="ab${note?' nt':''}" onclick="openSP('${key}')" title="Ghi chú"><i class="ti ti-notes"></i></button>
        <button class="ab" onclick="doDel('${key}','${hn}')"><i class="ti ti-trash" style="color:var(--red)"></i></button>
      </div></td>
    </tr>`;
  }).join('')}</tbody></table>`;
}

// ── BUILD CARDS (thẻ khách hàng) ──
function buildCards(list){
  list=[...list].sort((a,b)=>(b.von||0)-(a.von||0));
  if(!list.length) return`<div class="empty"><i class="ti ti-inbox" style="font-size:26px;display:block;margin-bottom:8px"></i>Không có dữ liệu</div>`;
  return list.map(c=>{
    const key=c._k;
    const id=c.idNhom||'';
    const hn=c.hoTen?c.hoTen.replace(/'/g,"\\'"):'';
    const ini=c.hoTen?c.hoTen.split(' ').slice(-2).map(w=>w[0]).join('').toUpperCase():'?';
    const tierCls=c.vip==='vip'?'t-v':c.vip==='diamond'?'t-d':c.vip==='gold'?'t-g':'';
    const tb=c.vip==='vip'?'<span class="t-vip"><i class="ti ti-crown" style="font-size:9px"></i>VIP</span>':
      c.vip==='diamond'?'<span class="t-dia"><i class="ti ti-diamond" style="font-size:9px"></i>Diamond</span>':
      c.vip==='gold'?'<span class="t-gold"><i class="ti ti-medal" style="font-size:9px"></i>Gold</span>':
      '<span class="t-thu">Thường</span>';
    const note=c.ghiChu||'';
    const noteEsc=note.replace(/"/g,'&quot;');
    const sd=(c.sdt||'').replace(/[^\d+]/g,'');
    const st=statusHtml(c);
    const rem=c.nhacNgay?`<div style="font-size:10px;color:${reminderDue(c)?'#C62828':'var(--text3)'}">⏰ Hẹn ${c.nhacNgay}</div>`:'';
    // Mini sparkline: 8 khung 5-ngày gần nhất, đếm số lần ghi nhật ký tương tác
    const hist=Array.isArray(c.noteHist)?c.noteHist:[];
    const now=Date.now();
    const buckets=new Array(8).fill(0);
    hist.forEach(n=>{ if(!n.time) return; const diff=Math.floor((now-n.time)/86400000); const b=Math.floor(diff/5); if(b>=0&&b<8) buckets[7-b]++; });
    const maxB=Math.max(1,...buckets);
    const spark=buckets.map(v=>`<b style="height:${v?Math.max(4,Math.round(v/maxB*20)):3}px" class="${v>0&&v===maxB?'hi':''}"></b>`).join('');
    const tierSel=`<select class="cc-tier-sel" onchange="quickSetTier('${key}',this.value)" onclick="event.stopPropagation()" title="Đổi hạng nhanh">
      <option value="vip"${c.vip==='vip'?' selected':''}>👑 VIP</option>
      <option value="diamond"${c.vip==='diamond'?' selected':''}>💎 Diamond</option>
      <option value="gold"${c.vip==='gold'?' selected':''}>🥇 Gold</option>
      <option value="none"${(!c.vip||c.vip==='none')?' selected':''}>Thường</option>
    </select>`;
    return`<div class="ccard">
      <div class="cc-top">
        <div class="cc-av${tierCls?' '+tierCls:''}">${ini}</div>
        <div style="flex:1;min-width:0">
          <div class="cc-nm" onclick="openSP('${key}')">${c.hoTen||''}</div>
          <div class="cc-meta"><span class="id-c">${id}</span>${tb}</div>
        </div>
      </div>
      <div class="cc-row"><span class="cc-von">${c.von?Math.round(c.von).toLocaleString('vi-VN')+'đ':'—'}</span><span>${c.ngay||'Chưa nhắn'}</span></div>
      <div class="cc-row" style="align-items:flex-end">
        <div class="cc-spark" title="Tần suất chăm sóc gần đây (mỗi cột = 5 ngày)">${spark}</div>
        <div>${st}</div>
      </div>
      ${rem}
      ${note?`<div class="cc-note" onclick="openSP('${key}')" title="${noteEsc}">📝 ${note}</div>`:''}
      <button class="cc-msg" onclick="doMsg('${key}','${hn}','${id}')" title="Nhắn hôm nay"><i class="ti ti-message"></i> Nhắn hôm nay</button>
      <div class="cc-acts">
        ${c.sdt?`<a class="cc-ab" href="tel:${sd}" title="Gọi"><i class="ti ti-phone"></i></a>`:'<span class="cc-ab" style="opacity:.3">—</span>'}
        <button class="cc-ab" onclick="openSP('${key}')" title="Ghi chú"><i class="ti ti-notes"></i></button>
        <button class="cc-ab" onclick="openModal('${key}')" title="Sửa"><i class="ti ti-edit"></i></button>
        <button class="cc-ab" onclick="doDel('${key}','${hn}')" title="Xóa"><i class="ti ti-trash" style="color:var(--red)"></i></button>
      </div>
      ${tierSel}
    </div>`;
  }).join('');
}
window.quickSetTier=function(key,tier){
  const c=C[key]; if(!c) return;
  if(DB) update(ref(DB,'customers/'+key),{vip:tier});
  C[key]={...c,vip:tier};
  addLog('edit','Đổi hạng nhanh: '+(c.hoTen||'')+' → '+tier);
  showToast('Đã đổi hạng','ok');
  refresh();
};
function toggleView(mode){
  viewMode=mode; localStorage.setItem('viewMode',mode);
  refresh();
}
window.toggleView=toggleView;

  return `<div class="vtg">
    <button class="vtb${viewMode==='list'?' on':''}" onclick="toggleView('list')" title="Xem danh sách"><i class="ti ti-list"></i></button>

function renderLog(){
  if(!LOGS.length){document.getElementById('MC').innerHTML='<div class="empty">Chưa có lịch sử</div>';return;}
  document.getElementById('MC').innerHTML=`<div class="tc" style="padding:14px">${LOGS.map(l=>{
    const col=l.action==='add'?'#4CAF50':l.action==='delete'?'#C62828':l.action==='confirm'?'#D4A017':l.action==='import'?'#6A1B9A':'#1ed760';
    return`<div class="li"><div class="ld" style="background:${col}"></div><div class="lt">${l.detail}${l.by?` <span style="color:var(--text3)">· ${l.by}</span>`:''}</div><div class="lti">${l.timeStr||''}</div></div>`;
  }).join('')}</div>`;
}

// ── ACTIONS ──
function doMsg(key,name,id){
  const t=todayS();
  if(DB) update(ref(DB,'customers/'+key),{ngay:t,nhacNgay:''});  // nhắn xong -> xoá lịch hẹn riêng
  if(C[key]) C[key]={...C[key],ngay:t,nhacNgay:''};
  addLog('update','Đã nhắn: '+name+' ('+id+') — '+t,key);
  showToast('Đã cập nhật: '+name,'ok');
  updateNav(); refresh();

function doDel(key,name){

function pick(o,keys){for(const k of Object.keys(o)){const kk=k.toLowerCase().trim();for(const t of keys){if(kk===t||kk.includes(t))return o[k];}}return '';}
window.parseImport=function(){
  const f=document.getElementById('impFile').files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{defval:''});
      importRows=raw.map(r=>{
        const von=parseInt(String(pick(r,['vốn','von','nav','vốn (vnđ)'])).replace(/[^\d]/g,''))||0;
        let ngay=pick(r,['ngày liên hệ','lần nhắn','ngay','ngày nhắc']);
        if(ngay instanceof Date) ngay=ngay.getDate()+'/'+(ngay.getMonth()+1)+'/'+ngay.getFullYear();
        else ngay=String(ngay||'').trim();
        return {hoTen:String(pick(r,['họ tên','ho ten','tên','name'])).trim(),
          idNhom:String(pick(r,['id nhóm','id nhom','id','nhóm'])).trim().toUpperCase(),
          sdt:String(pick(r,['sđt','sdt','điện thoại','phone'])).trim(),
          stk:String(pick(r,['stk','tài khoản','account'])).trim(),
          hopDong:String(pick(r,['hợp đồng','hop dong','mã hđ'])).trim(),
          email:String(pick(r,['email','mail'])).trim(),
          nguon:String(pick(r,['nguồn','nguon','source'])).trim(),
          von, vip:tTier(von), ngay,
          ghiChu:String(pick(r,['ghi chú','ghi chu','note'])).trim(), noteHist:[]};
      }).filter(x=>x.hoTen);
      const pv=document.getElementById('impPrev');
      if(!importRows.length){pv.innerHTML='<span style="color:var(--red)">Không đọc được dòng hợp lệ nào (thiếu cột Họ tên?)</span>';document.getElementById('impBtn').style.display='none';return;}
      const nv=importRows.filter(x=>x.vip==='vip').length,nd=importRows.filter(x=>x.vip==='diamond').length,ng=importRows.filter(x=>x.vip==='gold').length,nt=importRows.filter(x=>x.vip==='none').length;
      pv.innerHTML=`<div style="background:var(--green-light);border-radius:8px;padding:10px;color:var(--green)">✓ Đọc được <b>${importRows.length}</b> khách<br><span style="font-size:12px">👑 ${nv} VIP · 💎 ${nd} Diamond · 🥇 ${ng} Gold · 👤 ${nt} Thường</span></div>`;
      document.getElementById('impBtn').style.display='block';
    }catch(err){document.getElementById('impPrev').innerHTML='<span style="color:var(--red)">Lỗi đọc file: '+err.message+'</span>';}
  };
  rd.readAsArrayBuffer(f);
};
window.doImport=function(){
  if(!importRows.length) return;
  if(!DB){showToast('Chưa cấu hình Firebase — không thể lưu','warn');return;}
  let n=0;
  importRows.forEach(obj=>{ const r=push(ref(DB,'customers'),obj); C[r.key]=obj; n++; });
  addLog('import','Nhập '+n+' khách từ file');
  showToast('✓ Đã nhập '+n+' khách','ok');
  closeMD(); updateNav(); refresh();
};
window.openImport=openImport;

// ── MODAL THÊM ID ──
function openAddID(){
  const cols=IDCOLS.slice(0,8);
  selIDC=cols[0];
  document.getElementById('MW').innerHTML=`<div class="mb" onclick="closeMD(event)"><div class="md" onclick="event.stopPropagation()" style="width:340px">
    <div class="md-t"><span>Thêm ID mới</span><button class="mc-x" onclick="closeMD()">&times;</button></div>
    <div class="fg"><label class="fl">Tên ID *</label><input class="fi" id="nid" placeholder="VD: E409" style="text-transform:uppercase"></div>
    <div class="fg"><label class="fl">Màu</label><div class="icg">${cols.map((c,i)=>`<div class="ico${i===0?' sel':''}" style="background:${c}" onclick="pickIC(this,'${c}')"></div>`).join('')}</div></div>
    <button class="btn-sv" onclick="saveID()">Tạo ID</button>
    <button class="btn-cc" onclick="closeMD()">Hủy</button>
  </div></div>`;
}
function pickIC(el,c){selIDC=c;document.querySelectorAll('.ico').forEach(e=>e.classList.remove('sel'));el.classList.add('sel');}
function saveID(){
  const nm=document.getElementById('nid').value.trim().toUpperCase();
  if(!nm){showToast('Nhập tên ID!','warn');return;}
  if(IDS.includes(nm)){showToast('ID đã tồn tại!','warn');return;}
  const newIDS=[...IDS,nm];
  if(DB) set(ref(DB,'idList'),newIDS); else { IDS=newIDS; updateNav(); }
  addLog('add','Tạo ID: '+nm); showToast('Đã tạo '+nm,'ok'); closeMD();
}
window.openAddID=openAddID; window.pickIC=pickIC; window.saveID=saveID;

// ── ĐỔI MẬT KHẨU ──
function openPW(){
  document.getElementById('MW').innerHTML=`<div class="mb" onclick="closeMD(event)"><div class="md" onclick="event.stopPropagation()" style="width:360px">
    <div class="md-t"><span>🔑 Đổi mật khẩu</span><button class="mc-x" onclick="closeMD()">&times;</button></div>
    <div style="background:var(--blue-light);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:13px;color:var(--blue)">Đang đổi MK cho: <b>${curU?.name}</b></div>
    <div class="fg"><label class="fl">Mật khẩu hiện tại</label>
      <div class="pi-wrap"><input class="fi" type="password" id="pw1" placeholder="Nhập mật khẩu hiện tại">
      <button class="eye-btn" onclick="toggleEye('pw1',this)"><i class="ti ti-eye"></i></button></div>
    </div>
    <div class="fg"><label class="fl">Mật khẩu mới</label>
      <div class="pi-wrap"><input class="fi" type="password" id="pw2" placeholder="Tối thiểu 6 ký tự" oninput="checkStr(this.value)">
      <button class="eye-btn" onclick="toggleEye('pw2',this)"><i class="ti ti-eye"></i></button></div>
      <div style="background:var(--gray);border-radius:2px;height:4px;margin-top:5px;overflow:hidden"><div id="pw-bar" style="width:0%;background:#ccc;height:4px;border-radius:2px;transition:width .3s"></div></div>
      <div id="pw-hint" class="pw-hint" style="color:var(--text3)"></div>
    </div>
    <div class="fg"><label class="fl">Xác nhận mật khẩu mới</label>
      <div class="pi-wrap"><input class="fi" type="password" id="pw3" placeholder="Nhập lại mật khẩu mới">
      <button class="eye-btn" onclick="toggleEye('pw3',this)"><i class="ti ti-eye"></i></button></div>
    </div>
    <div id="pw-err" style="color:#C62828;font-size:12px;min-height:16px;margin-bottom:8px"></div>
    <button class="btn-sv" onclick="savePW()">Đổi mật khẩu</button>
    <button class="btn-cc" onclick="closeMD()">Hủy</button>
  </div></div>`;
}
function toggleEye(id,btn){
  const el=document.getElementById(id);
  if(el.type==='password'){el.type='text';btn.innerHTML='<i class="ti ti-eye-off"></i>';}
  else{el.type='password';btn.innerHTML='<i class="ti ti-eye"></i>';}
}
function checkStr(val){
  const bar=document.getElementById('pw-bar');
  const hint=document.getElementById('pw-hint');
  if(!val){bar.style.width='0%';hint.textContent='';return;}
  let s=0;
  if(val.length>=6)s++;if(val.length>=8)s++;
  if(/[A-Z]/.test(val))s++;if(/[0-9]/.test(val))s++;if(/[^A-Za-z0-9]/.test(val))s++;
  const lv=[{w:'20%',c:'#C62828',t:'Rất yếu'},{w:'40%',c:'#E65100',t:'Yếu'},{w:'60%',c:'#F9A825',t:'Trung bình'},{w:'80%',c:'#2E7D32',t:'Mạnh'},{w:'100%',c:'#1B5E20',t:'Rất mạnh'}];
  const l=lv[Math.min(s-1,4)]||lv[0];
  bar.style.width=l.w;bar.style.background=l.c;hint.textContent='Độ mạnh: '+l.t;hint.style.color=l.c;
}
async function savePW(){
  const old=document.getElementById('pw1').value;
  const n1=document.getElementById('pw2').value;
  const n2=document.getElementById('pw3').value;
  const err=document.getElementById('pw-err');
  const okOld=await verifyPw(curU, old);
  if(!okOld){err.textContent='❌ Mật khẩu hiện tại không đúng!';return;}
  if(n1.length<6){err.textContent='❌ Mật khẩu mới phải ít nhất 6 ký tự!';return;}
  if(n1===old){err.textContent='❌ Mật khẩu mới phải khác mật khẩu cũ!';return;}
  if(n1!==n2){err.textContent='❌ Mật khẩu xác nhận không khớp!';return;}
  if(!DB){curU.pw=n1;closeMD();showToast('✓ Đổi mật khẩu thành công (chưa có Firebase — chỉ tạm thời)','ok');return;}
  const h=await sha256(n1);
  set(ref(DB,'passwords/'+curU.id),h).then(()=>{
    curU.pw=n1; closeMD();
    showToast('✓ Đổi mật khẩu thành công! (đã mã hoá)','ok');
  }).catch(()=>{curU.pw=n1;closeMD();showToast('✓ Đổi mật khẩu thành công!','ok');});
}
window.openPW=openPW;window.toggleEye=toggleEye;window.checkStr=checkStr;window.savePW=savePW;

initLogin();
</script>
